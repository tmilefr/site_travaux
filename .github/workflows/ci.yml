name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, sqlite3, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Vérifier la syntaxe PHP
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Lancer les tests unitaires
        run: vendor/bin/phpunit --coverage-text --coverage-clover build/logs/clover.xml

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-${{ matrix.php }}
          path: build/logs
          if-no-files-found: ignore
